# Runs the database migrations and exits: no web server, so the JVM stops when Flyway is done.
#   ./gradlew bootRun --args='--spring.profiles.active=migrate'
#   docker run ... -e SPRING_PROFILES_ACTIVE=prod,migrate sluice
spring:
  main:
    web-application-type: none
  # No web server and no login: skip the OIDC client, so the migrate step neither needs the identity
  # provider to be up nor its client secret.
  autoconfigure:
    exclude:
      - org.springframework.boot.security.oauth2.client.autoconfigure.OAuth2ClientAutoConfiguration
      - org.springframework.boot.security.oauth2.client.autoconfigure.servlet.OAuth2ClientWebSecurityAutoConfiguration
sluice:
  database:
    migrate-on-startup: true
  jobs:
    worker:
      enabled: false
