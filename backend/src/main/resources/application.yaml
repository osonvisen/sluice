spring:
  application:
    name: sluice
  datasource:
    url: ${SLUICE_DB_URL:jdbc:postgresql://localhost:5432/sluice}
    username: ${SLUICE_DB_USER:sluice}
    password: ${SLUICE_DB_PASSWORD:sluice}
  flyway:
    locations: classpath:db/migration
  messages:
    basename: i18n/messages
    # Without this, a server running with a Norwegian system locale would answer
    # unsupported languages in Norwegian instead of the English fallback.
    fallback-to-system-locale: false
    encoding: UTF-8
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true
  # Login with Keycloak, Spring Boot as BFF (ADR 0004). Only a standard OIDC issuer is configured, so the
  # provider can be swapped by configuration. Boot reads the issuer's discovery document at startup:
  # without the `local-noauth` profile, the identity provider must be up before the app starts.
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${SLUICE_OIDC_CLIENT_ID:sluice-web}
            # Required (checked at startup): the confidential client's secret. keycloak/realm-sluice.json has the dev one.
            client-secret: ${SLUICE_OIDC_CLIENT_SECRET:}
            scope: openid,profile
        provider:
          keycloak:
            issuer-uri: ${SLUICE_OIDC_ISSUER_URI:http://localhost:8081/realms/sluice}
            user-name-attribute: preferred_username

server:
  shutdown: graceful
  servlet:
    session:
      # The BFF session: the browser only holds this cookie, never a token (ADR 0004).
      # Lax, not Strict: the redirect back from the identity provider must carry it.
      cookie:
        http-only: true
        same-site: lax
      timeout: 30m
  error:
    include-stacktrace: never
    include-message: never

# /health/live and /health/ready (ADR 0005 keeps actuator outside /api/**).
management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        health: health
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      group:
        live:
          include: livenessState
        ready:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

sluice:
  jobs:
    max-attempts: 5
    initial-backoff: 30s
    max-backoff: 1h
    backoff-jitter: 0.2
    lease: 5m
    batch-size: 10
    worker:
      enabled: true
      poll-interval: 2s
  erp:
    base-url: ${SLUICE_ERP_BASE_URL:http://localhost:8089}
    connect-timeout: 2s
    read-timeout: 10s
  shopify:
    # Required. The app's client secret, used to verify webhook signatures (X-Shopify-Hmac-Sha256).
    webhook-secret: ${SLUICE_SHOPIFY_WEBHOOK_SECRET:}

springdoc:
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    # "Try it out" on POST needs the CSRF token: Swagger UI sends the XSRF-TOKEN cookie as X-XSRF-TOKEN.
    csrf:
      enabled: true

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
